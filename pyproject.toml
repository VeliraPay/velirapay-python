[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "velirapay"
version = "0.2.2"
description = "Official Python library for VeliraPay crypto payments: charges, payment links, invoices, payouts, events and webhook verification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VeliraPay" }]
keywords = [
  "velirapay",
  "crypto",
  "crypto-payments",
  "cryptocurrency",
  "payments",
  "payment-gateway",
  "payment-processing",
  "bitcoin",
  "ethereum",
  "solana",
  "litecoin",
  "usdt",
  "usdc",
  "webhooks",
  "sdk",
  "api-client",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Office/Business :: Financial",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://velirapay.com"
Documentation = "https://velirapay.com/docs"
Repository = "https://github.com/VeliraPay/velirapay-python"
Issues = "https://github.com/VeliraPay/velirapay-python/issues"
Changelog = "https://github.com/VeliraPay/velirapay-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=2.4,<3",
  "readme-renderer[md]>=44",
  "ruff>=0.17,<0.18",
  "twine>=6.1",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/CHANGELOG.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/velirapay"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "examples"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PIE", "A"]
# The API names its objects' ids "id", and so do the methods that take one.
ignore = ["A002"]

[tool.ruff.lint.isort]
known-first-party = ["velirapay"]
