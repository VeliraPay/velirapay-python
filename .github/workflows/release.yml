name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Check the tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml, ${version}." >&2
            exit 1
          fi
          if ! grep -q "^## ${version} " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}, which the release notes are taken from." >&2
            exit 1
          fi

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check --group dev

      - name: Check code style
        run: ruff format --check && ruff check

      - name: Check types
        run: mypy

      - name: Build the package
        run: python -m build

      - name: Check the package
        run: twine check --strict dist/*

      - name: Run tests on the built wheel
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          python -m unittest --verbose

      - name: Keep the package for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/velirapay

    permissions:
      id-token: write

    steps:
      - name: Fetch the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## ${version} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found && (started || NF) { started = 1; print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}." >&2
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
